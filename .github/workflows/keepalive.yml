name: Keep schedules enabled

# GitHub disables scheduled workflows in a public repository after 60 days without commits.
# One empty commit a month keeps the uptime probe running.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep scheduled workflows enabled ($(date -u +%Y-%m))"
          git push
